# Stack fuer Backend und Datenbank.
#
# Diese Datei baut bewusst nichts: sie startet ein fertig getaggtes Image. Der
# Grund ist Portainer — dort ist das Bauen aus einem Git-Stack der unzuverlaessige
# Weg (der noetige Relative Path Support gibt es nur in der Business Edition).
# Gebaut wird deshalb ausserhalb, siehe docker-compose.build.yml und README.md.
#
# Die Migrationen laufen als eigener, einmaliger Dienst vor dem Backend. Sie im
# Anwendungsstart mitlaufen zu lassen (`migrationsRun`) waere bequemer, ist aber
# falsch, sobald mehr als eine Instanz startet: dann wenden zwei Prozesse
# gleichzeitig dieselbe Migration an.

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-wiupmo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD muss gesetzt sein}
      POSTGRES_DB: ${DB_NAME:-wiupmo}
      # Ohne feste Locale legt das Image die Datenbank mit der des Hosts an —
      # damit haenge die Sortierreihenfolge davon ab, wo der Container lief.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    volumes:
      # Auf /var/lib/postgresql, nicht auf .../data. Seit PostgreSQL 18 liegt
      # PGDATA versionsabhaengig unter /var/lib/postgresql/<major>/docker, und
      # der alte Pfad ist nur noch ein Symlink auf ".". Ein Volume dorthin zu
      # mounten laesst den Container nicht sauber starten.
      # PGDATA bleibt bewusst ungesetzt: das Image verwaltet die Versionsordner
      # selbst, und genau das macht spaeter ein Major-Upgrade moeglich.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-wiupmo} -d ${DB_NAME:-wiupmo}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # Kein Port nach aussen: nur das Backend spricht mit der Datenbank. Zum
    # Debuggen bei Bedarf voruebergehend "127.0.0.1:5432:5432" ergaenzen.
    expose:
      - '5432'

  migrate:
    image: ${BACKEND_IMAGE:-ghcr.io/lucakuehne/wiupmo/backend:main}
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    environment: &backend-env
      NODE_ENV: production
      PORT: '3000'
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_USER: ${DB_USER:-wiupmo}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-wiupmo}
      DB_SSL: 'false'
      AGENT_ENROLLMENT_TOKEN: ${AGENT_ENROLLMENT_TOKEN:?AGENT_ENROLLMENT_TOKEN muss gesetzt sein}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Auf 'true', sobald ein Reverse Proxy mit TLS davorsteht — sonst
      # verwirft der Browser das Sitzungscookie.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Optional. Fehlt es, erzeugt das Backend einmalig ein Geheimnis und legt
      # es in den Einstellungen ab.
      JWT_SECRET: ${JWT_SECRET:-}
      # Active Directory. Ohne AD_URL und AD_BASE_DN bleibt der Abgleich aus.
      AD_URL: ${AD_URL:-}
      AD_BASE_DN: ${AD_BASE_DN:-}
      AD_BIND_DN: ${AD_BIND_DN:-}
      AD_BIND_PASSWORD: ${AD_BIND_PASSWORD:-}
      AD_FILTER: ${AD_FILTER:-(objectClass=computer)}
      AD_SYNC_INTERVAL_MINUTES: ${AD_SYNC_INTERVAL_MINUTES:-360}
      AD_STARTUP_DELAY_SECONDS: ${AD_STARTUP_DELAY_SECONDS:-60}
      AD_TLS_REJECT_UNAUTHORIZED: ${AD_TLS_REJECT_UNAUTHORIZED:-true}
    command:
      - node
      - node_modules/typeorm/cli.js
      - '-d'
      - dist/src/database/data-source.js
      - 'migration:run'

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/lucakuehne/wiupmo/backend:main}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment: *backend-env
    ports:
      # Nur die linke Seite ist verstellbar: im Container hoert das Backend
      # immer auf 3000 (siehe PORT oben), nach aussen veroeffentlicht wird
      # HOST_PORT. Das ist die Stellschraube, wenn auf dem Host schon etwas
      # anderes auf 3000 liegt.
      #
      # Das Backend gehoert ins Firmennetz bzw. hinter den VPN-Zugang, nicht ins
      # Internet. Steht ein Reverse Proxy davor, gehoert in BIND_ADDRESS 127.0.0.1.
      - '${BIND_ADDRESS:-0.0.0.0}:${HOST_PORT:-3000}:3000'
    volumes:
      # Ablage der Agent-Binaries. Wird ab Phase 6 beschrieben; das Volume steht
      # schon hier, damit es beim ersten Release nicht neu angelegt werden muss.
      - agent-releases:/app/agent-releases
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres-data:
  agent-releases:
