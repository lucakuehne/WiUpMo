# Test-Stack "wiupmo-test" auf dem Docker-Server: eine eigene WiUpMo-Instanz mit
# eigener Datenbank, ein Samba-AD fuer Abgleich und LDAP-Anmeldung, ein Runner
# fuer die Testskripte und ein Playwright-Container fuer die Oberflaeche.
#
# Angelegt, gesteuert und wieder entfernt wird er von deploy/test-stack.ps1 ueber
# die Portainer-API - nicht von Hand und nie mit `docker compose up` auf dem
# Server. Die Testskripte kommen aus dem Arbeitsstand des Laptops, das Skript
# legt sie per Docker-API in die Container.
#
# Variable: WIUPMO_IMAGE (Standard ghcr.io/lucakuehne/wiupmo/backend:main), z. B.
# das auf dem Server gebaute wiupmo:dev.
#
# Die Instanz ist von aussen nicht erreichbar - die Testzugaenge stehen im
# Repository. Alle Dienste sprechen sich ueber das Stack-Netz mit ihrem
# Dienstnamen an. Speichergrenzen schuetzen die anderen Dienste auf dem Server.

x-image: &image ${WIUPMO_IMAGE:-ghcr.io/lucakuehne/wiupmo/backend:main}

x-backend-env: &backend-env
  NODE_ENV: production
  PORT: '3000'
  DB_HOST: testdb
  DB_PORT: '5432'
  DB_USER: wiupmo
  DB_PASSWORD: nur-fuer-den-test-stack
  DB_NAME: wiupmo
  DB_SSL: 'false'
  COOKIE_SECURE: 'false'
  JWT_SECRET: nur-fuer-den-test-stack-0123456789abcdef
  AGENT_ENROLLMENT_TOKEN: nur-fuer-den-test-stack-enrollment
  # Kein Abgleich nach Zeitplan waehrend der Tests: Der AD-Test loest ihn
  # selbst aus und zaehlt die Ergebnisse.
  AD_STARTUP_DELAY_SECONDS: '3600'
  AGENT_RELEASES_DIR: /app/agent-releases

services:
  testdb:
    image: postgres:18-alpine
    mem_limit: 256m
    environment:
      POSTGRES_USER: wiupmo
      POSTGRES_PASSWORD: nur-fuer-den-test-stack
      POSTGRES_DB: wiupmo
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    volumes:
      # Benanntes Volume, damit der Migrationstest das Image wechseln kann,
      # ohne die Daten zu verlieren.
      - testdb-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wiupmo -d wiupmo']
      interval: 5s
      timeout: 5s
      retries: 20

  # Wie in der Produktion: einmalig vor dem Backend. Das Skript startet ihn nach
  # dem Leeren der Datenbank erneut.
  migrate:
    image: *image
    restart: 'no'
    mem_limit: 256m
    depends_on:
      testdb:
        condition: service_healthy
    environment: *backend-env
    command: ['node', 'node_modules/typeorm/cli.js', '-d', 'dist/src/database/data-source.js', 'migration:run']

  backend:
    image: *image
    mem_limit: 512m
    depends_on:
      testdb:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment: *backend-env
    volumes:
      - agent-releases:/app/agent-releases
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/health || exit 1']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Domaene TEST.WIUPMO. Das Zertifikat fuer LDAPS erzeugt der Runner, das
  # Skript spielt es ein (backend/test/ad-setup.sh).
  samba:
    image: smblds/smblds:latest
    hostname: samba
    mem_limit: 512m
    environment:
      REALM: TEST.WIUPMO
      DOMAIN: TESTWIUPMO
      ADMINPASS: 'Adm1n-Passw0rd!'
    volumes:
      - testfiles:/testfiles:ro

  # Fuehrt die API- und AD-Tests aus. Dasselbe Image wie das Backend: Die
  # Skripte laufen unter /app/test und finden dort dessen node_modules.
  runner:
    image: *image
    user: root
    mem_limit: 256m
    working_dir: /app
    volumes:
      - testfiles:/testfiles
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -e
        mkdir -p /app/test /testfiles/tls
        cd /testfiles/tls
        if [ ! -f cert.pem ]; then
          apk add --no-cache openssl >/dev/null
          openssl req -x509 -newkey rsa:2048 -nodes -keyout ca.key -out ca.pem -days 30 -subj "/CN=WiUpMo Test CA" \
            -addext "basicConstraints=critical,CA:TRUE" -addext "keyUsage=critical,keyCertSign,cRLSign" 2>/dev/null
          openssl req -newkey rsa:2048 -nodes -keyout key.pem -out server.csr -subj "/CN=samba" 2>/dev/null
          printf 'subjectAltName=DNS:samba,DNS:localhost\nextendedKeyUsage=serverAuth\nkeyUsage=critical,digitalSignature,keyEncipherment\nbasicConstraints=CA:FALSE\n' >ext.cnf
          openssl x509 -req -in server.csr -CA ca.pem -CAkey ca.key -CAcreateserial -out cert.pem -days 30 -extfile ext.cnf 2>/dev/null
          chmod 644 ca.pem cert.pem key.pem
        fi
        echo "Testdateien bereit"
        exec tail -f /dev/null

  # Prueft die Oberflaeche im Browser und legt Bildschirmfotos unter /out ab.
  # Die Paketversion muss zur Version des Images passen.
  playwright:
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    mem_limit: 1g
    shm_size: 256m
    working_dir: /work
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -e
        mkdir -p /work /out
        cd /work
        [ -d node_modules/playwright ] || npm install --no-save --no-audit --no-fund --loglevel=error playwright@1.64.1
        echo "Playwright bereit"
        exec tail -f /dev/null

volumes:
  testdb-data:
  agent-releases:
  testfiles:
