# Baut das Backend-Image und legt es in der GitHub Container Registry ab.
#
# Damit muss auf dem Docker-Host nichts mehr gebaut werden: Portainer zieht ein
# fertiges, versioniertes Image. Der Weg ueber ghcr.io braucht keine zusaetzliche
# Infrastruktur — die Registry gehoert zum GitHub-Konto.

name: Backend-Image

on:
  push:
    branches: [main]
    # Ein Commit am Agent oder an der Dokumentation soll keinen Image-Build
    # ausloesen. Der Agent hat seinen eigenen Release-Zyklus.
    paths:
      - 'backend/**'
      - 'deploy/Dockerfile'
      - '.github/workflows/backend-image.yml'
    tags: ['backend/v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Wird von GitHub selbst gestellt, es ist kein eigenes Geheimnis noetig.
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `backend/v0.2.0` wird zu `0.2.0`, jeder main-Commit zusaetzlich zu
          # `main` und zur kurzen Commit-Kennung. Portainer bekommt einen festen
          # Tag genannt, nie `latest` — sonst laesst sich hinterher nicht mehr
          # feststellen, welcher Stand tatsaechlich laeuft.
          tags: |
            type=match,pattern=backend/v(.*),group=1
            type=ref,event=branch
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
