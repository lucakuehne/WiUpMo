# Prueft den Code und baut danach das Backend-Image fuer die GitHub Container
# Registry.
#
# Damit muss auf dem Docker-Host nichts mehr gebaut werden: Portainer zieht ein
# fertiges, versioniertes Image. Der Weg ueber ghcr.io braucht keine zusaetzliche
# Infrastruktur — die Registry gehoert zum GitHub-Konto.
#
# deploy/release.ps1 wartet auf genau diesen Lauf, bevor es ausrollt. Der Name
# der Datei steht dort, also nicht umbenennen, ohne das Skript nachzuziehen.

name: Backend-Image

on:
  push:
    branches: [main]
    # Eine Aenderung an der Dokumentation soll keinen Build ausloesen, eine am
    # Quelltext schon — und zwar auch am Agent: Sein Binary wird in dasselbe
    # Image gebaut, damit das Backend es beim Start selbst aufnehmen kann.
    paths: &image-paths
      - 'backend/**'
      # Das Frontend wird in dasselbe Image gebaut und vom Backend
      # ausgeliefert — eine Aenderung dort braucht also ebenfalls ein neues Image.
      - 'frontend/**'
      - 'agent/**'
      - 'deploy/Dockerfile'
      - '.dockerignore'
      - 'NuGet.config'
      - '.github/workflows/backend-image.yml'
    tags: ['backend/v*']
  # Ein Pull-Request wird nur geprueft, nicht gebaut.
  pull_request:
    paths: *image-paths
  workflow_dispatch:

# Ein neuer Push auf denselben Zweig loest den laufenden ab. Ausgerollt wird
# ohnehin nur der juengste Stand.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Wird im ersten Schritt durch die kleingeschriebene Fassung ersetzt; hier
  # steht sie nur als Vorgabe, falls der Schritt einmal entfaellt.
  IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  # Was der Image-Build selbst nicht prueft: Unit-Tests und die Erzeugung des
  # OpenAPI-Dokuments. Uebersetzt wird hier wie im Dockerfile (node 24,
  # corepack), damit beide Wege dieselbe pnpm-Version benutzen.
  test:
    runs-on: ubuntu-latest
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - run: corepack enable

      - name: Backend installieren
        working-directory: backend
        run: pnpm install --frozen-lockfile
      # Prueft mit, dass jede Migration in data-source.ts eingetragen ist.
      - name: Backend uebersetzen
        working-directory: backend
        run: pnpm build
      - name: Unit-Tests
        working-directory: backend
        run: pnpm test
      - name: OpenAPI-Dokument
        working-directory: backend
        run: pnpm check:openapi

      - name: Frontend installieren
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend-Typecheck
        working-directory: frontend
        run: pnpm typecheck

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      # Registry-Namen muessen kleingeschrieben sein, der Repository-Name ist es
      # nicht ("lucakuehne/WiUpMo"). Die metadata-action erledigt das fuer ihre
      # Tags selbst; die Cache-Referenz unten wird von Hand zusammengesetzt und
      # scheiterte daran mit "repository name must be lowercase".
      - name: Image-Namen kleinschreiben
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}/backend" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Wird von GitHub selbst gestellt, es ist kein eigenes Geheimnis noetig.
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `backend/v0.2.0` wird zu `0.2.0`, jeder main-Commit zusaetzlich zu
          # `main` und zur kurzen Commit-Kennung. Portainer bekommt einen festen
          # Tag genannt, nie `latest` — sonst laesst sich hinterher nicht mehr
          # feststellen, welcher Stand tatsaechlich laeuft.
          tags: |
            type=match,pattern=backend/v(.*),group=1
            type=ref,event=branch
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Der Cache liegt in der Registry, nicht im Cache-Dienst von GitHub.
          #
          # Mit `type=gha,mode=max` blieb der Lauf in der Export-Phase stehen
          # ("writing layer"): Seit der Agent-Stufe wandert das gesamte .NET-SDK
          # mit durch, und die Cache-Schnittstelle von GitHub kommt bei dieser
          # Menge nicht mit. Die Registry, in die das Image ohnehin geht, kommt
          # damit muehelos zurecht — die Anmeldung steht schon.
          #
          # `mode=max` bleibt damit moeglich und ist hier auch noetig: Nur so
          # ueberspringen spaetere Laeufe die Agent-Stufe, wenn sich am Agent
          # nichts geaendert hat.
          #
          # `ignore-error`, damit ein Problem beim Cache nicht den ganzen Lauf
          # scheitern laesst — das Image ist dann bereits gebaut und hochgeladen.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max,ignore-error=true
